  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Helvetica Neue", Arial, sans-serif; line-height: 1.7; color: #333333; background-color: #f4f7f9; }

.hero {

<body>
  <div id="app"></div>

  <!-- 写真ポップアップ (Modal) -->

  <script>
(function () {
'use strict';

/* =====================================================================
   データ保存: ブラウザの localStorage (サーバー不要 / no backend)
   ===================================================================== */
const KEY = 'ptravel_v1', SKEY = 'ptravel_session';
const ADMIN_EMAIL = 'admin@example.com', ADMIN_PASS = 'admin123', STUDENT_PASS = 'student123';
const DEFAULT_PHOTO = 'images/fuji.jpg';

const SEED = {
  2024: [
    ['vihara','ビハラ','images/2024 students/vihara.webp','クルーズから見る富士山','クルーズから見る富士山がとてもきれいで、忘れられない思い出になりました。',''],
    ['afuka','アフカ','images/2024 students/afuka.webp','おいしいランチと写真撮影','友達と一緒においしいランチを食べたり、写真を撮ったりできて楽しかったです。',''],
    ['karki','カルキ','images/2024 students/karki.webp','三保の松原と久能山東照宮の見学','三保の松原と久能山東照宮を見学して、日本の歴史や文化を学ぶことができました。',''],
    ['sharma','サルマ','images/2024 students/sharma.webp','バスの中の雰囲気とクラスメイト','バスの中の雰囲気も良く、クラスメイトみんなと仲良くなれる最高の行事でした。','']
  ],
  2025: [
    ['ayau','アユ','images/2025 students/ayau.webp','船の上からの景色','船の上から見る景色が最高でした。海風も気持ちよく、また参加したいです。',''],
    ['khadka','カドカ','images/2025 students/khadka.webp','友達との思い出','普段なかなか行けない場所を友達と一緒に回れて、とても充実した一日でした。',''],
    ['karishma','カリスマ','images/2025 students/karishma.webp','久能山東照宮の建物','久能山東照宮の建物が美しく、日本の歴史に興味を持つきっかけになりました。',''],
    ['sapana','サパナ','images/2025 students/sapana.webp','写真スポットでの思い出','写真スポットがたくさんあって、思い出に残るすばらしい一日になりました。','']
  ],
  2026: [
    ['kumari','クマリ','images/2026 students/kumari.webp','駿河湾クルーズと富士山','駿河湾クルーズで富士山を見ることができて感動しました。写真もたくさん撮れました。',''],
    ['sangita','サンギタ','images/2026 students/sangita.webp','ランチタイムの会話','はとばキッチンのランチがおいしく、友達との会話も弾んで楽しかったです。',''],
    ['gc','ジシ','images/2026 students/gc.webp','研修旅行の感想','美しい景色と歴史ある場所の両方を楽しめて、思い出に残る研修旅行になりました。',''],
    ['dan','ダン','images/2026 students/dan.webp','最高の景色と思い出','天気に恵まれて最高の景色でした！友達と最高の思い出が作れて大満足です。','']
  ]
};

let db = null, me = null, flashMsg = null;
const ui = { homeYear: null, sYear: '', sQ: '', mYear: '', mStatus: '' };

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => { const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

function normalizeUrl(u) {
  const s = String(u || '').trim();
  if (!s) return '';
  if (/^https?:\/\//i.test(s)) return s;
  return 'https://' + s;
}

async function hashPw(_email, pw) {
  const s = 'ptravel-salt:' + pw;
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.charCodeAt(0)) | 0;
  return 'x' + h;
}

async function makeSeed() {
  const d = { years: [], users: [], memories: [], comments: [] };
  d.users.push({ id: 'admin', name: '管理者', email: ADMIN_EMAIL, pass: await hashPw(ADMIN_EMAIL, ADMIN_PASS), role: 'admin', year: null, bio: '', website: '', created: now() });
  for (const y of Object.keys(SEED)) {
    d.years.push({ year: +y, active: true });
    for (const r of SEED[y].slice().reverse()) {
      const email = r[0] + '@example.com';
      d.users.push({ id: 's_' + r[0], name: r[1], email, pass: await hashPw(email, STUDENT_PASS), role: 'student', year: +y, bio: '', website: r[5] || '', created: now() });
      d.memories.push({ id: 'm_' + r[0], userId: 's_' + r[0], year: +y, title: r[3], desc: r[4], photo: r[2], status: 'approved', created: now(), likes: [] });
    }
  }
  return d;
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch (e) { alert('保存できませんでした（ブラウザの容量オーバーです）。古い写真を削除してください。'); return false; }
}

/* ---------- helpers ---------- */
const user = id => db.users.find(u => u.id === id);
const mem = id => db.memories.find(m => m.id === id);
const yearsAll = () => db.years.slice().sort((a, b) => a.year - b.year);
const yearsActive = () => yearsAll().filter(y => y.active);
const authorName = u => !u ? '?' : (u.role === 'student' ? u.name + 'さん' : '管理者');
const STATUS = { pending: '承認待ち', approved: '公開中', rejected: '却下' };
const canSee = m => m.status === 'approved' || (me && (me.role === 'admin' || me.id === m.userId));
const flash = (msg, type) => { flashMsg = { msg, type: type || 'ok' }; };
const go = h => { if (location.hash === h) render(); else location.hash = h; };

function readImage(file) {
  return new Promise((resolve, reject) => {
    if (!file) return reject('写真を選択してください');
    if (!/^image\/(jpeg|png|gif|webp)$/.test(file.type)) return reject('JPG / PNG / GIF / WEBP の画像のみアップロードできます');
    if (file.size > 15 * 1024 * 1024) return reject('ファイルが大きすぎます');
    const fr = new FileReader();
    fr.onerror = () => reject('読み込みに失敗しました');
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject('画像を読み込めませんでした');
      img.onload = () => {
        const s = Math.min(1, 900 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.75));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* =====================================================================
   画面パーツ
   ===================================================================== */
function nav() {
  let r;
  if (me && me.role === 'student')
    r = '<a href="#/my">マイ思い出</a><a href="#/upload">写真を投稿</a><a href="#/profile">プロフィール・URL編集</a><span class="hello">' + esc(me.name) + 'さん</span><button class="linklike" data-act="logout">ログアウト</button>';
  else if (me)
    r = '<a href="#/admin">管理画面</a><button class="linklike" data-act="logout">ログアウト</button>';
  else
    r = '<a href="#/login">学生ログイン</a><a class="pill" href="#/register">新規登録</a><a href="#/admin-login">管理者</a>';
  return '<nav class="topnav"><div class="topnav-inner"><a class="brand" href="#/">🚢 清水・駿河湾クルーズ</a><a href="#/reviews">参加者の感想</a>' + r + '</div></nav>';
}
const FOOTER = '<footer><p>※バス走行中は安全のため必ずシートベルトの着用をお願いいたします。</p><p style="margin-top: 4px;">企画手配：株式会社 第一観光</p></footer>';
const shell = body => {
  let f = '';
  if (flashMsg) { f = '<div class="flashes"><div class="flash ' + flashMsg.type + '">' + esc(flashMsg.msg) + '</div></div>'; flashMsg = null; }

};

/* ---------- 思い出の詳細 ---------- */
function memoryView(id) {
  const m = mem(id);
  if (!m || !canSee(m)) return notFound();
  const u = user(m.userId);
  const comments = db.comments.filter(c => c.memId === id);
  const liked = me && m.likes.indexOf(me.id) >= 0;
  const canInteract = me && me.role === 'student' && m.status === 'approved';
  let likeHtml;
  if (canInteract) likeHtml = '<button class="like-btn' + (liked ? ' on' : '') + '" data-act="like" data-id="' + esc(id) + '">' + (liked ? '❤ いいね済み' : '🤍 いいね') + ' (' + m.likes.length + ')</button>';
  else likeHtml = '<p class="meta">❤ ' + m.likes.length + ' 件のいいね' + (!me ? ' ・ <a href="#/login">ログイン</a>していいねできます' : '') + '</p>';
  const websiteHtml = (u && u.website)
    ? '<p style="margin:12px 0;"><a class="btn sm ghost" href="' + esc(u.website) + '" target="_blank" rel="noopener noreferrer">🌐 ' + esc(u.name) + 'さんのWebサイトを見る ↗</a></p>'
    : '';
  const bioHtml = (u && u.bio)
    ? '<p class="modal-bio" style="margin:10px 0; max-width:100%; text-align:left;"><strong>👤 プロフィール:</strong> ' + esc(u.bio) + '</p>'
    : '';
  const cl = comments.map(c => {
    const cu = user(c.userId);
    const del = me && (me.role === 'admin' || me.id === c.userId) ? '<button class="btn sm red" style="margin-top:6px;" data-act="delComment" data-id="' + esc(c.id) + '">削除</button>' : '';
    return '<div class="comment"><div class="who">' + esc(authorName(cu)) + '<span class="when">' + esc(c.created) + '</span></div><p>' + esc(c.body) + '</p>' + del + '</div>';
  }).join('') || '<p class="meta">まだコメントはありません。</p>';
  const form = canInteract
    ? '<form data-form="comment" data-id="' + esc(id) + '" class="mt"><label class="f">コメントを書く</label><textarea name="body" maxlength="500" required></textarea><div class="mt"><button class="btn">投稿する</button></div></form>'
    : (!me ? '<p class="meta mt"><a href="#/login">ログイン</a>するとコメントできます。</p>' : '');
  return shell(page(
    '<p style="margin-bottom:12px;"><a href="#/reviews" data-act="backToYear" data-year="' + m.year + '">⬅ ' + m.year + '年の感想一覧へ</a></p>' +
    '<div class="card">' + (m.status !== 'approved' ? '<p class="flash error">この投稿は現在 ' + badge(m.status) + ' です。</p>' : '') +
    '<img class="memory-photo" src="' + esc(m.photo) + '" alt="' + esc(m.title) + '"><h1 style="margin-top:16px;">' + esc(m.title) + '</h1>' +
    '<p class="meta">' + esc(authorName(u)) + ' ・ ' + m.year + '年 ・ ' + esc(m.created) + '</p>' +
    websiteHtml + bioHtml +
    (m.desc ? '<p class="memory-desc">' + esc(m.desc) + '</p>' : '') + likeHtml + '</div>' +
    '<div class="card" id="comments"><h2>💬 コメント (' + comments.length + ')</h2>' + cl + form + '</div>'));
}

    '<label class="f">' + (isNew ? 'パスワード（空欄なら自動生成）' : '新しいパスワード（変更する場合のみ）') + '</label><input type="text" name="pw" autocomplete="off">' +
    '<label class="f">自己紹介・感想（任意）</label><textarea name="bio" maxlength="300">' + esc(s.bio) + '</textarea>' +
    '<div class="mt row"><button class="btn">保存</button><a class="btn gray" href="#/admin/students">キャンセル</a></div></form></div>');
}
function adminMemories() {
  let list = db.memories.slice();
  if (ui.mYear) list = list.filter(m => String(m.year) === String(ui.mYear));
  if (ui.mStatus) list = list.filter(m => m.status === ui.mStatus);
  list.reverse().sort((a, b) => (b.status === 'pending') - (a.status === 'pending'));
  const rows = list.map(m => '<tr><td>' + thumb(m) + '</td><td><a href="#/memory/' + esc(m.id) + '">' + esc(m.title) + '</a><br><small>' + esc(authorName(user(m.userId))) + '</small></td><td>' + m.year + '</td><td>' + badge(m.status) + '</td><td>' + m.likes.length + '</td><td>' + db.comments.filter(c => c.memId === m.id).length + '</td><td class="row">' +
    (m.status !== 'approved' ? '<button class="btn sm green" data-act="setStatus" data-id="' + esc(m.id) + '" data-status="approved">承認</button>' : '') +
    (m.status !== 'rejected' ? '<button class="btn sm gray" data-act="setStatus" data-id="' + esc(m.id) + '" data-status="rejected">却下</button>' : '') +
    '<a class="btn sm ghost" href="#/admin/memories/' + esc(m.id) + '">編集</a><button class="btn sm red" data-act="memDel" data-id="' + esc(m.id) + '">削除</button></td></tr>').join('') ||
    '<tr><td colspan="7" class="center">該当する記録がありません。</td></tr>';
  const so = ['pending', 'approved', 'rejected'].map(k => '<option value="' + k + '"' + (ui.mStatus === k ? ' selected' : '') + '>' + STATUS[k] + '</option>').join('');
  return adminShell('m', '<h1>📸 旅行記録の管理</h1><p class="lead">写真の承認・却下、タイトルと説明の編集、削除ができます。 <a class="btn sm" href="#/admin/memories/new">＋ 写真をアップロード</a></p>' +
    '<form class="filters"><select data-filter="mYear"><option value="">すべての年度</option>' + yearOptions(yearsAll(), ui.mYear) + '</select>' +
    '<select data-filter="mStatus"><option value="">すべての状態</option>' + so + '</select></form>' +
    '<div class="card table-wrap"><table class="t"><tr><th>写真</th><th>タイトル / 投稿者</th><th>年度</th><th>状態</th><th>❤</th><th>💬</th><th>操作</th></tr>' + rows + '</table></div>');
}
function adminMemoryNew() {
  const st = db.users.filter(u => u.role === 'student').sort((a, b) => (b.year - a.year) || a.name.localeCompare(b.name))
    .map(s => '<option value="' + esc(s.id) + '">' + esc(s.name) + '（' + s.year + '年）</option>').join('');
  return adminShell('m', '<h1>⬆️ 写真をアップロード（管理者）</h1><p class="lead">管理者がアップロードした写真は、すぐに公開されます。</p><div class="card narrow"><form data-form="memNew">' +
    '<label class="f">年度</label><select name="year" required><option value="">選択してください</option>' + yearOptions(yearsAll(), '') + '</select>' +
    '<label class="f">学生（任意）</label><select name="user"><option value="">管理者（公式写真）</option>' + st + '</select>' +
    '<label class="f">タイトル</label><input type="text" name="title" maxlength="80" required><label class="f">説明</label><textarea name="desc" maxlength="1000"></textarea>' +
    '<label class="f">写真</label><input id="photoInput" type="file" name="photo" accept="image/*" required><img id="preview" class="preview" alt="preview">' +
    '<div class="mt row"><button class="btn">アップロードして公開</button><a class="btn gray" href="#/admin/memories">キャンセル</a></div></form></div>');
}
function adminMemoryEdit(id) {
  const m = mem(id); if (!m) return notFound();
  const so = ['pending', 'approved', 'rejected'].map(k => '<option value="' + k + '"' + (m.status === k ? ' selected' : '') + '>' + STATUS[k] + '</option>').join('');
  return adminShell('m', '<h1>✏️ 旅行記録を編集</h1><div class="card narrow"><img class="memory-photo" style="max-height:240px;" src="' + esc(m.photo) + '" alt="">' +
    '<p class="meta">投稿者: ' + esc(authorName(user(m.userId))) + ' ・ ' + esc(m.created) + '</p><form data-form="memEdit" data-id="' + esc(id) + '">' +
    '<label class="f">タイトル</label><input type="text" name="title" maxlength="80" required value="' + esc(m.title) + '">' +
    '<label class="f">説明・感想</label><textarea name="desc" maxlength="1000">' + esc(m.desc) + '</textarea>' +
    '<label class="f">年度</label><select name="year">' + yearOptions(yearsAll(), m.year) + '</select><label class="f">状態</label><select name="status">' + so + '</select>' +
    '<div class="mt row"><button class="btn">保存</button><a class="btn gray" href="#/admin/memories">キャンセル</a></div></form></div>');
}
function adminComments() {
  const rows = db.comments.slice().reverse().map(c => { const m = mem(c.memId); return '<tr><td>' + esc(user(c.userId) ? user(c.userId).name : '?') + '</td><td style="max-width:340px;white-space:pre-wrap;">' + esc(c.body) + '</td><td>' +
    (m ? '<a href="#/memory/' + esc(m.id) + '">' + esc(m.title) + '</a> (' + m.year + ')' : '-') + '</td><td>' + esc(c.created) + '</td><td><button class="btn sm red" data-act="delComment" data-id="' + esc(c.id) + '">削除</button></td></tr>'; }).join('') ||
    '<tr><td colspan="5" class="center">コメントはまだありません。</td></tr>';
  return adminShell('c', '<h1>💬 コメント管理</h1><p class="lead">不適切なコメントを削除できます。（全 ' + db.comments.length + ' 件）</p><div class="card table-wrap"><table class="t"><tr><th>投稿者</th><th>コメント</th><th>投稿先</th><th>日時</th><th></th></tr>' + rows + '</table></div>');
}

/* =====================================================================
   ルーター
   ===================================================================== */
let pendingScroll = false;
function render() {
  const sid = sessionStorage.getItem(SKEY);
  me = (sid && user(sid)) || null;
  const p = (location.hash.replace(/^#/, '') || '/').split('/').filter(Boolean);
  const a = p[0] || '', b = p[1];
  const needAdmin = a === 'admin', needStudent = ['profile', 'upload', 'my'].indexOf(a) >= 0;
  let html;
  if (needAdmin && (!me || me.role !== 'admin')) { flash('管理者としてログインしてください', 'error'); return go('#/admin-login'); }
  if (needStudent && (!me || me.role !== 'student')) { flash('学生としてログインしてください', 'error'); return go('#/login'); }
  pendingScroll = false;
  if (a === '' ) html = homeView();
  else if (a === 'reviews') { html = homeView(); pendingScroll = true; }
  else if (a === 'login') html = me && me.role === 'student' ? (go('#/my'), '') : loginView('student');
  else if (a === 'admin-login') html = me && me.role === 'admin' ? (go('#/admin'), '') : loginView('admin');
  else if (a === 'register') html = registerView();
  else if (a === 'memory') html = memoryView(b);
  else if (a === 'profile') html = profileView();
  else if (a === 'upload') html = uploadView();
  else if (a === 'my') html = myView();
  else if (a === 'admin') {
    if (!b) html = adminDash();
    else if (b === 'years') html = adminYears();
    else if (b === 'students') html = p[2] ? adminStudentForm(p[2]) : adminStudents();
    else if (b === 'memories') html = p[2] === 'new' ? adminMemoryNew() : (p[2] ? adminMemoryEdit(p[2]) : adminMemories());
    else if (b === 'comments') html = adminComments();
    else html = notFound();
  } else html = notFound();
  document.getElementById('app').innerHTML = html;
  if (pendingScroll) { const r = document.getElementById('reviews'); if (r) r.scrollIntoView(); } else window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

/* =====================================================================
   ボタン操作 (data-act)
   ===================================================================== */
function cascadeDeleteMemory(id) {
  db.memories = db.memories.filter(m => m.id !== id);
  db.comments = db.comments.filter(c => c.memId !== id);
}
const actions = {
  logout() { sessionStorage.removeItem(SKEY); go(me && me.role === 'admin' ? '#/admin-login' : '#/'); },
  openModal(id) {
    const m = mem(id); if (!m) return;
    const u = user(m.userId);
    document.getElementById('modalImg').src = m.photo;
    document.getElementById('modalTitle').textContent = m.title;
    document.getElementById('modalMeta').textContent = authorName(u) + ' ・ ' + m.year + '年';
    
    const bioEl = document.getElementById('modalBio');
    if (u && u.bio) {
      bioEl.textContent = '👤 ' + u.bio;
      bioEl.style.display = 'block';
    } else {
      bioEl.style.display = 'none';
    }

    document.getElementById('modalCaption').textContent = m.desc ? '「 ' + m.desc + ' 」' : '';
    
    const webEl = document.getElementById('modalWebsite');
    if (u && u.website) {
      webEl.href = u.website;
      webEl.style.display = 'inline-block';
    } else {
      webEl.style.display = 'none';
    }

    document.getElementById('modalLink').href = '#/memory/' + m.id;
    document.getElementById('photoModal').style.display = 'flex';
  },
  closeModal() { document.getElementById('photoModal').style.display = 'none'; },
  backToYear(id, t) { ui.homeYear = +t.dataset.year; },
  like(id) {
    const m = mem(id); if (!m || !me || me.role !== 'student') return;
    const i = m.likes.indexOf(me.id); if (i >= 0) m.likes.splice(i, 1); else m.likes.push(me.id);
    save(); render();
  },
  delComment(id) {
    const c = db.comments.find(x => x.id === id); if (!c || !me) return;
    if (me.role !== 'admin' && me.id !== c.userId) return;
    if (!confirm('このコメントを削除しますか？')) return;
    db.comments = db.comments.filter(x => x.id !== id); save(); flash('コメントを削除しました'); render();
  },
  delMine(id) {
    const m = mem(id); if (!m || !me || m.userId !== me.id) return;
    if (!confirm('削除しますか？')) return;
    cascadeDeleteMemory(id); save(); flash('削除しました'); render();
  },
  setStatus(id, t) {
    const m = mem(id); if (!m) return;
    m.status = t.dataset.status; save();
    flash(m.status === 'approved' ? '承認しました ✅' : '却下しました'); render();
  },
  memDel(id) { if (!confirm('この記録を削除しますか？')) return; cascadeDeleteMemory(id); save(); flash('削除しました'); render(); },
  yearToggle(id, t) {
    const y = db.years.find(x => String(x.year) === t.dataset.year); y.active = !y.active; save();
    flash(y.year + '年度を' + (y.active ? '表示' : '非表示') + 'にしました'); render();
  },
  yearDel(id, t) {
    const y = db.years.find(x => String(x.year) === t.dataset.year);
    if (db.users.some(u => u.year === y.year) || db.memories.some(m => m.year === y.year)) { flash('学生または思い出が登録されている年度は削除できません（非表示にできます）', 'error'); return render(); }
    if (!confirm(y.year + '年度を削除しますか？')) return;
    db.years = db.years.filter(x => x !== y); save(); flash(y.year + '年度を削除しました'); render();
  },
  filterYear(id, t) { ui.sYear = t.dataset.year; ui.sQ = ''; },
  stuDel(id) {
    const s = user(id); if (!s || s.role !== 'student') return;
    if (!confirm(s.name + ' のアカウントと投稿・コメントをすべて削除します。よろしいですか？')) return;
    db.memories.filter(m => m.userId === id).forEach(m => cascadeDeleteMemory(m.id));
    db.comments = db.comments.filter(c => c.userId !== id);
    db.memories.forEach(m => { m.likes = m.likes.filter(x => x !== id); });
    db.users = db.users.filter(u => u.id !== id); save(); flash(s.name + ' のアカウントを削除しました'); render();
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t && actions[t.dataset.act]) actions[t.dataset.act](t.dataset.id, t, e);
  if (e.target.id === 'photoModal') actions.closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') actions.closeModal(); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'yearSel') { ui.homeYear = +t.value; document.getElementById('reviewsBox').innerHTML = reviewsBox(); }
  else if (t.id === 'regYearSelect') {
    const box = document.getElementById('regCustomYearBox');
    const inp = document.getElementById('regCustomYear');
    if (t.value === 'new') { box.style.display = 'block'; inp.required = true; }
    else { box.style.display = 'none'; inp.required = false; }
  }
  else if (t.dataset && t.dataset.filter) { ui[t.dataset.filter] = t.value; render(); }
  else if (t.id === 'photoInput' && t.files && t.files[0]) { const pv = document.getElementById('preview'); pv.src = URL.createObjectURL(t.files[0]); pv.style.display = 'block'; }
  else if (t.id === 'regPhotoInput' && t.files && t.files[0]) { const pv = document.getElementById('regPreview'); pv.src = URL.createObjectURL(t.files[0]); pv.style.display = 'block'; }
});

/* =====================================================================
   フォーム送信 (data-form)
   ===================================================================== */
const val = (f, n) => (f.elements[n] ? f.elements[n].value : '').trim();
function err(m) { flash(m, 'error'); render(); }
const randPw = () => { const a = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; const r = crypto.getRandomValues(new Uint8Array(10)); r.forEach(x => s += a[x % a.length]); return s; };

const forms = {
  async login(f) {
    const role = f.dataset.role, email = val(f, 'email').toLowerCase(), pw = f.elements.password.value;
    const u = db.users.find(x => x.email === email), h = await hashPw(email, pw);
    if (!u || u.pass !== h) return err('メールアドレスまたはパスワードが違います');
    if (u.role !== role) return err('このアカウントはこのログイン画面では使えません。' + (u.role === 'admin' ? '管理者ログインをご利用ください。' : '学生ログインをご利用ください。'));
    sessionStorage.setItem(SKEY, u.id); go(role === 'admin' ? '#/admin' : '#/my');
  },
  async register(f) {
    const name = val(f, 'name'), email = val(f, 'email').toLowerCase(), pw = f.elements.password.value;
    const rawYear = f.elements.year.value;
    let year = rawYear === 'new' ? +f.elements.custom_year.value : +rawYear;
    const website = normalizeUrl(val(f, 'website'));
    const bio = val(f, 'bio').slice(0, 500);
    const title = val(f, 'title') || (name + 'さんの研修旅行の感想');
    const e = [];
    if (!name) e.push('名前を入力してください');
    if (!EMAIL_RE.test(email)) e.push('メールアドレスの形式が正しくありません');
    if (pw.length < 8) e.push('パスワードは8文字以上にしてください');
    if (rawYear === 'new') {
      if (!year || year < 2000 || year > 2100) e.push('新しい年度は 2000〜2100 の数字で入力してください');
    } else if (!yearsActive().some(y => y.year === year)) {
      e.push('参加年度を選択してください');
    }
    if (db.users.some(u => u.email === email)) e.push('このメールアドレスは既に登録されています');
    if (e.length) return err(e.join(' / '));

    let photo = DEFAULT_PHOTO;
    if (f.elements.photo && f.elements.photo.files && f.elements.photo.files[0]) {
      try { photo = await readImage(f.elements.photo.files[0]); }
      catch (m) { return err(String(m)); }
    }

    if (!db.years.some(y => y.year === year)) {
      db.years.push({ year, active: true });
    }
    const newUid = uid();
    const u = { id: newUid, name, email, pass: await hashPw(email, pw), role: 'student', year, bio, website, created: now() };
    db.users.push(u);

    // 登録完了後、参加者の感想一覧にも反映
    db.memories.push({
      id: 'm_' + uid(),
      userId: newUid,
      year,
      title,
      desc: bio || '清水・駿河湾クルーズ研修旅行に参加しました！',
      photo,
      status: 'approved',
      created: now(),
      likes: []
    });

    if (!save()) return;
    ui.homeYear = year;
    sessionStorage.setItem(SKEY, u.id);
    flash(name + 'さんのアカウント登録が完了しました 🎉 「マイ思い出」や「プロフィール・URL編集」からいつでも編集できます。');
    go('#/my');
  },
  async profile(f) {
    const name = val(f, 'name'), email = val(f, 'email').toLowerCase(), npw = f.elements.npw.value, e = [];
    if (!name) e.push('名前を入力してください');
    if (!EMAIL_RE.test(email)) e.push('メールアドレスの形式が正しくありません');
    if (db.users.some(u => u.email === email && u.id !== me.id)) e.push('このメールアドレスは既に使われています');
    if (npw) {
      if (me.pass !== await hashPw(me.email, f.elements.cur.value)) e.push('現在のパスワードが違います');
      if (npw.length < 8) e.push('新しいパスワードは8文字以上にしてください');
    }
    if (e.length) return err(e.join(' / '));
    me.name = name;
    me.bio = val(f, 'bio').slice(0, 300);
    me.website = normalizeUrl(val(f, 'website'));
    me.email = email;
    if (npw) me.pass = await hashPw(email, npw);
    save(); flash('プロフィールとWebサイトURLを更新しました'); render();
  },
  async upload(f) {
    const title = val(f, 'title'); if (!title) return err('タイトルを入力してください');
    try {
      const photo = await readImage(f.elements.photo.files[0]);
      db.memories.push({ id: uid(), userId: me.id, year: me.year, title, desc: val(f, 'desc').slice(0, 1000), photo, status: 'approved', created: now(), likes: [] });
      if (!save()) { db.memories.pop(); return; }
      ui.homeYear = me.year;
      flash('投稿が完了しました 🎉'); go('#/my');
    } catch (m) { err(String(m)); }
  },
  comment(f) {
    const m = mem(f.dataset.id), body = val(f, 'body');
    if (!m || m.status !== 'approved' || !me || me.role !== 'student') return;
    if (!body || body.length > 500) return err('コメントは1〜500文字で入力してください');
    db.comments.push({ id: uid(), memId: m.id, userId: me.id, body, created: now() }); save(); flash('コメントを投稿しました'); render();
  },
  addYear(f) {
    const y = +f.elements.year.value;
    if (!y || y < 2000 || y > 2100) return err('年度は 2000〜2100 の数字で入力してください');
    if (db.years.some(x => x.year === y)) return err(y + '年度は既に登録されています');
    db.years.push({ year: y, active: true }); save(); flash(y + '年度を追加しました。'); render();
  },
  stuFilter(f) { ui.sYear = f.elements.year.value; ui.sQ = f.elements.q.value.trim(); render(); },
  async stuForm(f) {
    const id = f.dataset.id, isNew = id === 'new', name = val(f, 'name'), email = val(f, 'email').toLowerCase(), year = +f.elements.year.value;
    const website = normalizeUrl(val(f, 'website'));
    const bio = val(f, 'bio').slice(0, 300);
    let pw = f.elements.pw.value; const e = [];
    if (isNew && !pw) pw = randPw();
    if (!name) e.push('名前を入力してください');
    if (!EMAIL_RE.test(email)) e.push('メールアドレスの形式が正しくありません');
    if (pw && pw.length < 8) e.push('パスワードは8文字以上にしてください');
    if (!db.years.some(y => y.year === year)) e.push('年度を選択してください');
    if (db.users.some(u => u.email === email && u.id !== id)) e.push('このメールアドレスは既に使われています');
    if (e.length) return err(e.join(' / '));
    if (isNew) {
      const newUid = uid();
      db.users.push({ id: newUid, name, email, pass: await hashPw(email, pw), role: 'student', year, website, bio, created: now() });
      db.memories.push({
        id: 'm_' + uid(),
        userId: newUid,
        year,
        title: name + 'さんの研修旅行の感想',
        desc: bio || '清水・駿河湾クルーズ研修旅行に参加しました！',
        photo: DEFAULT_PHOTO,
        status: 'approved',
        created: now(),
        likes: []
      });
      ui.homeYear = year;
      save(); flash('学生を登録しました。ログイン: ' + email + ' / 初期パスワード: ' + pw);
    } else {
      const s = user(id); if (!s) return;
      s.name = name; s.email = email; s.year = year; s.website = website; s.bio = bio;
      if (pw) s.pass = await hashPw(email, pw);
      db.memories.filter(m => m.userId === id).forEach(m => { m.year = year; });
      save(); flash('学生情報を更新しました');
    }
    go('#/admin/students');
  },
  async memNew(f) {
    const year = +f.elements.year.value, title = val(f, 'title'), who = f.elements.user.value || 'admin';
    if (!title) return err('タイトルを入力してください');
    try {
      const photo = await readImage(f.elements.photo.files[0]);
      db.memories.push({ id: uid(), userId: who, year, title, desc: val(f, 'desc').slice(0, 1000), photo, status: 'approved', created: now(), likes: [] });
      if (!save()) { db.memories.pop(); return; }
      ui.homeYear = year;
      flash('写真を公開しました'); go('#/admin/memories');
    } catch (m) { err(String(m)); }
  },
  memEdit(f) {
    const m = mem(f.dataset.id), title = val(f, 'title'); if (!m) return;
    if (!title) return err('タイトルを入力してください');
    m.title = title; m.desc = val(f, 'desc').slice(0, 1000); m.year = +f.elements.year.value; m.status = f.elements.status.value;
    save(); flash('更新しました'); go('#/admin/memories');
  }
};
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); forms[f.dataset.form](f);
});

/* ---------- 起動 ---------- */
(async function init() {
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) { db = null; }
  if (!db || !db.users) { db = await makeSeed(); save(); }
  render();
})();
})();
  </script>
</body>
