{% extends "base.html" %}
{% block title %}管理者ログイン{% endblock %}
{% block content %}
<div class="page">
  <div class="card narrow">
    <h1>🔐 管理者ログイン</h1>
    <p class="lead">Administrator Login</p>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label class="f" for="email">メールアドレス (Email)</label>
      <input id="email" type="email" name="email" required autofocus>
      <label class="f" for="password">パスワード (Password)</label>
      <input id="password" type="password" name="password" required>
      <div class="mt"><button class="btn" style="width:100%">管理者としてログイン</button></div>
    </form>
    <p class="small-link"><a href="{{ url_for('login') }}">学生ログインはこちら</a></p>
  </div>
</div>
{% endblock %}
