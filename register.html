{% extends "base.html" %}
{% block title %}学生ログイン{% endblock %}
{% block content %}
<div class="page">
  <div class="card narrow">
    <h1>🎓 学生ログイン</h1>
    <p class="lead">Student Login</p>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label class="f" for="email">メールアドレス (Email)</label>
      <input id="email" type="email" name="email" required autofocus>
      <label class="f" for="password">パスワード (Password)</label>
      <input id="password" type="password" name="password" required>
      <div class="mt"><button class="btn" style="width:100%">ログイン</button></div>
    </form>
    <p class="small-link">アカウントがない方は <a href="{{ url_for('register') }}">新規登録</a> ／ <a href="{{ url_for('admin_login') }}">管理者ログイン</a></p>
  </div>
</div>
{% endblock %}
